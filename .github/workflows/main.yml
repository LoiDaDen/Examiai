
name: Examinai Staging CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examinai-staging
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION
  # ==========================================
  validate:
    name: Validate Source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # Tam thoi khong chan Staging vi source
      # dang con cac loi ESLint can xu ly.
      - name: ESLint (advisory - staging only)
        id: lint
        continue-on-error: true
        run: pnpm run lint

      - name: Report ESLint issues
        if: ${{ steps.lint.outcome == 'failure' }}
        run: |
          echo "::warning::ESLint has outstanding errors."
          echo "Fix source lint errors before production release."

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT
  # ==========================================
  deploy:
    name: Deploy to Ubuntu Staging
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Examinai using SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          SSH_KEY_B64: ${{ secrets.STAGING_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

        run: |
          set -euo pipefail

          echo "===================================="
          echo "EXAMINAI STAGING DEPLOYMENT"
          echo "===================================="

          # 1. Validate required configuration
          : "${SSH_HOST:?Missing SSH host}"
          : "${SSH_USER:?Missing SSH user}"
          : "${SSH_PORT:?Missing SSH port}"
          : "${SSH_KEY_B64:?Missing SSH private key Base64}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH known hosts}"

          # 2. Prepare SSH directory
          echo "Preparing SSH configuration..."

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # 3. Decode Base64 private key
          printf '%s' "$SSH_KEY_B64" \
            | base64 --decode \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          # 4. Validate private key
          echo "Validating SSH private key..."

          ssh-keygen -y -P "" \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null

          echo "SSH private key format: OK"

          # 5. Configure verified SSH host key
          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            | tr -d '\r' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH known_hosts configured"

          # 6. Connect to Ubuntu and deploy
          echo "Connecting to Ubuntu staging server..."

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            'sudo -n /usr/local/sbin/examinai-deploy-staging'

          echo "===================================="
          echo "EXAMINAI STAGING DEPLOY COMPLETED"
          echo "===================================="
