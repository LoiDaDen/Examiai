
name: Examinai Production SSH Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssh:
    name: Verify Production SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Check SSH Connection and Deploy Permission
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          SSH_KEY_B64: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

        run: |
          set -Eeuo pipefail

          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_KEY_B64:?Missing SSH_KEY_B64}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$SSH_KEY_B64" \
            | base64 --decode \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            | tr -d '\r' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -P '' \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null

          echo "Connecting to Production..."

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'set -eu
             echo "SSH CONNECTION SUCCESS"
             whoami
             sudo -n -l \
               /usr/local/sbin/examinai-deploy-production \
               0000000000000000000000000000000000000000 \
               > /dev/null
             echo "DEPLOY PERMISSION VERIFIED"'

          echo "PRODUCTION SSH TEST PASSED"
