name: Examinai Production CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examinai-production-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: CI - Production Validate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm exec tsc --noEmit

      - name: ESLint Check
        run: pnpm exec eslint . --max-warnings=0

      - name: Docker Build Test
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder-publishable-key \
            -t "examinai-ci:${GITHUB_SHA}" \
            .

  deploy:
    name: CD - Deploy Production
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Deploy approved commit to Ubuntu
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          SSH_KEY_B64: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          : "${SSH_HOST:?Missing PROD SSH host}"
          : "${SSH_USER:?Missing PROD SSH user}"
          : "${SSH_KEY_B64:?Missing PROD SSH key}"
          : "${SSH_KNOWN_HOSTS:?Missing known_hosts}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/id_ed25519" > /dev/null

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/sbin/examinai-deploy-production $GITHUB_SHA"

